name: veterinary-clinic-system

services:

  veterinary-clinic-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veterinary-clinic-backend
    restart: unless-stopped
    profiles: ['full']
    env_file:
      - .env
    environment:

      DB_HOST: host.docker.internal
      DB_PORT: '5433'
      REDIS_HOST: host.docker.internal
      REDIS_PORT: '6380'
      STORAGE_ENDPOINT: http://host.docker.internal:9000
      AI_SERVICE_BASE_URL: http://veterinary-clinic-ai:8000

      PORT: '3000'
    ports:

      - '3010:3000'
    volumes:
      - veterinary-clinic-uploads:/app/uploads

    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 10s

      start_period: 40s
      retries: 3

  veterinary-clinic-worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: veterinary-clinic-worker
    restart: unless-stopped
    profiles: ['full']
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: '5433'
      REDIS_HOST: host.docker.internal
      REDIS_PORT: '6380'

  veterinary-clinic-ai:
    build:
      context: ../veterinary-clinic-ai
      dockerfile: Dockerfile
    container_name: veterinary-clinic-ai
    restart: unless-stopped
    profiles: ['full']
    env_file:
      - ../veterinary-clinic-ai/.env
    ports:
      - '8000:8000'

volumes:
  veterinary-clinic-uploads:
