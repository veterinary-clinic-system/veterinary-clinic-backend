name: Backend CI/CD

# - Moi push / PR: typecheck, unit test, build, migration, e2e.
# - Push len master (hoac chay tay): build image api, day len GHCR, roi SSH vao
#   Lightsail chay deploy/deploy.sh api. Buoc deploy chi chay khi da dat secret
#   LIGHTSAIL_SSH_KEY va bien LIGHTSAIL_HOST (xem docs trong deploy/README.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: vetclinic
      DB_PASSWORD: vetclinic
      DB_DATABASE: veterinary_clinic
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      AI_SERVICE_BASE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: ci-token
      AI_PROVIDER: stub
      # Khong dat S3_*: API van chay, chi tai tep len la tra 503 (test khong goi S3).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vetclinic
          POSTGRES_PASSWORD: vetclinic
          POSTGRES_DB: veterinary_clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetclinic -d veterinary_clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint "src/**/*.ts"
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run migration:run
      - run: npm run test:e2e

  image:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
    steps:
      - name: Check deploy settings
        id: check
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::notice::Bo qua deploy: chua dat secret LIGHTSAIL_SSH_KEY / bien LIGHTSAIL_HOST."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy api to Lightsail
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCMS_DIR: ${{ vars.VCMS_DIR || '~/vcms/veterinary-clinic-backend' }}
        with:
          host: ${{ vars.LIGHTSAIL_HOST }}
          username: ${{ vars.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,VCMS_DIR
          command_timeout: 12m
          script: |
            set -e
            cd "${VCMS_DIR/#\~/$HOME}"
            git pull --ff-only origin master
            bash deploy/deploy.sh api
